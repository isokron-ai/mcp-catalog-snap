name: 'mcp-catalog-snap'
description: >-
  Re-capture an MCP server's tools/prompts/resource-template catalog and fail
  the job if it drifted from the committed .mcp-catalog snapshot (catalog drift
  silently invalidates prompt-cache prefixes and changes agent behavior).
author: 'IsoKron'
branding:
  icon: 'camera'
  color: 'orange'

inputs:
  servers-config:
    description: 'Path to the .mcp-catalog.json listing servers to check.'
    required: false
    default: '.mcp-catalog.json'
  working-directory:
    description: 'Directory to run in (where the config and snapshots live).'
    required: false
    default: '.'
  ignore-descriptions:
    description: 'Do not treat description-only changes as drift (true/false).'
    required: false
    default: 'false'
  allow-additions:
    description: 'Do not treat added read-only tools / prompts / templates as drift (true/false). Added tools that are not read-only still fail unless allow-write-additions is also true.'
    required: false
    default: 'false'
  allow-write-additions:
    description: 'With allow-additions, also waive added tools that are not read-only (write/destructive) (true/false).'
    required: false
    default: 'false'
  server:
    description: 'Only check this configured server name.'
    required: false
    default: ''
  timeout-ms:
    description: 'Per-request timeout in milliseconds.'
    required: false
    default: '30000'
  timeout-total-ms:
    description: 'Deadline for each server''s whole capture in milliseconds (empty = none). On expiry the server''s process group is ended.'
    required: false
    default: ''
  node-version:
    description: 'Node.js version to set up for the CLI (needs >= 20).'
    required: false
    default: '22'

outputs:
  drift:
    description: '"true" when any server drifted, else "false".'
    value: ${{ steps.check.outputs.drift }}
  report:
    description: 'Path to the JSON report written by the check (unset when no report was written, e.g. a config error).'
    value: ${{ steps.check.outputs.report }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Build the pinned copy of the CLI that ships with this action ref, so the
    # check uses exactly the version the workflow pinned (no npm lookup).
    - name: Build mcp-catalog-snap
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build

    - name: Check MCP catalog snapshots
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_CONFIG: ${{ inputs.servers-config }}
        INPUT_IGNORE_DESCRIPTIONS: ${{ inputs.ignore-descriptions }}
        INPUT_ALLOW_ADDITIONS: ${{ inputs.allow-additions }}
        INPUT_ALLOW_WRITE_ADDITIONS: ${{ inputs.allow-write-additions }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TIMEOUT: ${{ inputs.timeout-ms }}
        INPUT_TIMEOUT_TOTAL: ${{ inputs.timeout-total-ms }}
      run: |
        set +e
        args=(check --config "$INPUT_CONFIG" --timeout "$INPUT_TIMEOUT")
        [ "$INPUT_IGNORE_DESCRIPTIONS" = "true" ] && args+=(--ignore-descriptions)
        [ "$INPUT_ALLOW_ADDITIONS" = "true" ] && args+=(--allow-additions)
        [ "$INPUT_ALLOW_WRITE_ADDITIONS" = "true" ] && args+=(--allow-write-additions)
        [ -n "$INPUT_SERVER" ] && args+=(--server "$INPUT_SERVER")
        [ -n "$INPUT_TIMEOUT_TOTAL" ] && args+=(--timeout-total "$INPUT_TIMEOUT_TOTAL")

        report="$RUNNER_TEMP/mcp-catalog-report.json"
        rm -f "$report"
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" --report "$report" 2>mcp-catalog-check.err | tee mcp-catalog-check.txt
        code=${PIPESTATUS[0]}

        # The server's stderr reaches mcp-catalog-check.err raw (the CLI forwards it), so it is untrusted:
        # echo it with workflow-command processing stopped under a token it cannot know, so `::error::`,
        # `::add-mask::` or `##[...]` lines in it are shown, not run. Same stream as the action's own
        # `::error` lines below, so the resume line is always processed before them.
        ensure_nl() { [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ] && echo; return 0; }
        if [ -s mcp-catalog-check.err ]; then
          stop_token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop_token"
          cat mcp-catalog-check.err
          ensure_nl mcp-catalog-check.err
          echo "::$stop_token::"
        fi
        # A code block for the step summary whose fence is longer than any backtick run in the file,
        # so a fence in server text cannot close it.
        fenced() {
          local n fence
          n=$(LC_ALL=C grep -oE '`+' "$1" 2>/dev/null | LC_ALL=C awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')
          [ "$n" -lt 3 ] && n=2
          fence=$(printf '%*s' "$((n + 1))" '' | tr ' ' '`')
          echo "$fence"
          cat "$1"
          ensure_nl "$1"
          echo "$fence"
        }
        # only point at a report that was actually written
        [ -f "$report" ] && echo "report=$report" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 1 ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; else echo "drift=false" >> "$GITHUB_OUTPUT"; fi

        # tool safety from the report: added tools that are not read-only, tools whose annotations got less safe
        risky=0; destructive=0; less=0
        if [ -f "$report" ]; then
          read -r risky destructive less < <(node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            let a = 0, d = 0, l = 0;
            for (const s of r.servers || []) {
              const x = s.diff && s.diff.safety;
              if (!x) continue;
              for (const t of x.added) if (t.safety !== "read-only") { a++; if (t.safety === "destructive") d++; }
              l += x.lessSafe.length;
            }
            process.stdout.write(`${a} ${d} ${l}\n`);' "$report" 2>/dev/null || echo "0 0 0")
        fi
        safety_summary() {
          if [ "$risky" -gt 0 ]; then
            echo "### Not read-only: $risky added tool(s) can write ($destructive destructive)"
            echo
            echo 'Each is marked `[write]` or `[destructive]` below. A read-only deployment that lists them has failed open.'
            echo
          fi
          if [ "$less" -gt 0 ]; then
            echo "### Less safe: $less tool(s) changed annotations toward write/destructive"
            echo
          fi
        }

        # every exit path writes a summary; every failure also emits ::error
        case "$code" in
          0)
            { echo "## MCP catalog: no drift"; echo; safety_summary; } >> "$GITHUB_STEP_SUMMARY"
            [ "$risky" -gt 0 ] && echo "::warning title=MCP catalog: tools that can write were added::$risky added tool(s) are not read-only ($destructive destructive), waived by allow-write-additions"
            ;;
          1)
            {
              echo "## MCP catalog drift detected"
              echo
              safety_summary
              fenced mcp-catalog-check.txt
              echo
              echo 'Re-snapshot with `npx mcp-catalog-snap snapshot` and commit `.mcp-catalog/` if the change is intended.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=MCP catalog drift::tool catalog differs from .mcp-catalog snapshot (prompt-cache prefix changed)"
            [ "$risky" -gt 0 ] && echo "::error title=MCP catalog: tools that can write were added::$risky added tool(s) are not read-only ($destructive destructive); see the step summary"
            [ "$less" -gt 0 ] && echo "::error title=MCP catalog: tool annotations became less safe::$less tool(s); see the step summary"
            ;;
          3)
            {
              echo "## MCP catalog snapshot failed its integrity check"
              echo
              echo 'A committed `.mcp-catalog/` file does not match its own `sha256` (edited by hand or corrupted); nothing was compared.'
              echo 'Restore it from git, or re-capture with `npx mcp-catalog-snap snapshot` and review the diff.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=MCP catalog snapshot tampered::stored sha256 does not match the snapshot's catalog body"
            ;;
          *)
            {
              echo "## MCP catalog check could not run (exit $code)"
              echo
              fenced mcp-catalog-check.err
              echo
              echo 'Usual causes: a `${VAR}` in the config that is not set in the job, a server that failed to start, or a timeout.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=MCP catalog check failed::mcp-catalog-snap exited with code $code; see the step summary"
            ;;
        esac
        rm -f mcp-catalog-check.txt mcp-catalog-check.err
        exit "$code"
