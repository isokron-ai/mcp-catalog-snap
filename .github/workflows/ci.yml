name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Dogfood the composite action against the committed examples/ snapshots.
  action:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Run from a copy outside the checkout: here the action path IS the
      # checkout, whose node_modules (installed by the action with
      # --ignore-scripts) hold kronicle-lite/sea-lite devDependencies without
      # the better-sqlite3 binding, and `npx` inside the checkout would pick
      # those up instead of fetching the pinned packages like a user's repo does.
      - run: cp -r examples "$RUNNER_TEMP/examples"
      - uses: ./
        with:
          # resolved inside working-directory, like every path the action takes
          servers-config: .mcp-catalog.json
          working-directory: ${{ runner.temp }}/examples
